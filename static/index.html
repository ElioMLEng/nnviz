<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nnviz 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;font:13px system-ui,Segoe UI,sans-serif;overflow:hidden}
  #gl{position:fixed;inset:0}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lb{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;text-shadow:0 0 4px #000,0 0 4px #000}
  .lb b{font-size:13px}.lb span{display:block;font-size:11px;color:#888}
  .lb.sel b{text-decoration:underline}
  .lb.rl{transform:translate(-100%,-50%);text-align:right}
  .lb.rl span{display:inline;margin-left:8px}
  :root{--bg:#0b0b0fe6;--line:#23232b;--mut:#8a8a96;--fg:#e4e4ea;--acc:#5cdcff;--ctl:#16161d}
  #left{position:fixed;left:12px;top:12px;width:372px;display:flex;flex-direction:column;gap:8px;
        max-height:calc(100vh - 24px - var(--legend-h, 190px) - 8px);pointer-events:none}
  #left > section{pointer-events:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
  #ctl header{display:flex;align-items:baseline;gap:6px;padding:8px 10px 0 12px}
  #ctl .brand{font-weight:700;letter-spacing:.02em;color:var(--fg)} #ctl .sub3d{color:var(--acc);font-weight:700}
  #ctl header .sp{flex:1}
  #ctl{overflow:auto;min-height:0}
  #ctl .body{padding:6px 12px 10px}
  #ctl.closed .body{display:none}
  #ctl .sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:10px 0 5px;display:flex;align-items:center;gap:8px}
  #ctl .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  #ctl .row{display:flex;gap:6px;align-items:center;margin:4px 0}
  #ctl .grow{flex:1;min-width:0}
  #ctl select,#ctl button,#ctl input[type=text],#ctl input:not([type]){background:var(--ctl);color:var(--fg);border:1px solid #30303a;border-radius:6px;padding:5px 8px;font:inherit}
  #ctl button{cursor:pointer} #ctl button:hover:not(:disabled){border-color:#4a4a58;background:#1d1d27}
  #ctl button.icon{padding:5px 9px} #ctl button:disabled,#ctl select:disabled{opacity:.5}
  #ctl details{margin:4px 0;color:var(--mut)} #ctl details summary{cursor:pointer;font-size:12px}
  #ctl details input{width:100%;box-sizing:border-box;margin-top:5px}
  .seg{display:flex;flex:1;border:1px solid #30303a;border-radius:6px;overflow:hidden}
  .seg button{flex:1;border:0 !important;border-radius:0 !important;background:var(--ctl)}
  .seg button + button{border-left:1px solid #30303a !important}
  .seg button.on{background:#20384a !important;color:var(--acc)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:flex;align-items:center;gap:5px;border:1px solid #30303a;border-radius:999px;padding:3px 10px;background:var(--ctl);cursor:pointer;user-select:none;font-size:12px}
  .chip input{display:none}
  .chip::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid #666}
  .chip:has(input:checked){border-color:#2b6a86;background:#14222b;color:var(--acc)}
  .chip:has(input:checked)::before{background:var(--acc);border-color:var(--acc)}
  #pred{display:inline-block;color:#9fe;background:#10241f;border:1px solid #1f4a3f;border-radius:999px;padding:2px 10px;font-size:12px}
  #pred:empty{display:none}
  #status{margin-top:8px;font-size:11px;line-height:1.35;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #legend{position:fixed;left:12px;bottom:12px;width:372px;background:var(--bg);border:1px solid var(--line);border-radius:10px;
          padding:6px 10px 8px;backdrop-filter:blur(6px)}
  #legend .lh{display:flex;align-items:center;cursor:pointer;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:2px 0 4px}
  #legend .lh span{flex:1}
  #legend.closed .items,#legend.closed .foot{display:none}
  #legend .it{display:flex;align-items:center;gap:8px;height:21px;white-space:nowrap}
  #legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
  #legend .nm{width:118px;flex:none;color:var(--fg)}
  #legend .ds{color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  #legend .foot{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap}
  #panel{position:fixed;right:12px;top:96px;bottom:12px;width:320px;background:#0b0b0fe6;border:1px solid #222;border-radius:8px;padding:12px;overflow:auto;display:none}
  #panel h2{margin:0 0 4px;font-size:16px}
  #panel .k{color:#888}
  #panel table{border-collapse:collapse;width:100%;margin:8px 0}
  #panel td{padding:2px 4px;border-bottom:1px solid #1c1c22}
  #panel canvas{display:inline-block;margin:1px;border:1px solid #222}
  #hint{position:fixed;right:12px;bottom:12px;color:#666}
  #card{position:fixed;left:396px;top:12px;width:400px;max-width:calc(100vw - 396px - 344px);max-height:calc(100vh - 24px);
        overflow:auto;padding:10px 14px 12px;display:none;line-height:1.45;background:var(--bg);border:1px solid var(--line);
        border-radius:10px;backdrop-filter:blur(6px);box-sizing:border-box}
  #left > section, #legend{box-sizing:border-box}
  #card h3{margin:0;font-size:15px}
  #card .sub{color:#888;font-size:12px;margin:2px 0 6px}
  #card .tag{color:#9fe;margin:4px 0 6px}
  #card h4{margin:8px 0 2px;font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:.04em}
  #card ul{margin:0;padding-left:18px} #card li{margin:2px 0}
  #card .x{position:absolute;right:8px;top:6px;cursor:pointer;color:#888}
  #panel .desc{margin:8px 0;padding:8px;background:#12121a;border-radius:6px;line-height:1.45}
  #panel .desc p{margin:6px 0} #panel .desc .dt{font-weight:600;color:#e0e0e0}
  #title{position:fixed;right:18px;top:12px;text-align:right;pointer-events:none;max-width:42vw}
  #title .nm{font-size:30px;font-weight:800;letter-spacing:-0.01em;line-height:1.1;color:#fff;
             text-shadow:0 0 22px rgba(92,220,255,.35),0 2px 0 rgba(0,0,0,.6)}
  #title .nm i{font-style:normal;font-weight:300;opacity:.75}
  #title .sb{margin-top:5px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9aa0ad}
  #title .ln{height:2px;margin:7px 0 0 auto;width:64px;border-radius:2px;background:linear-gradient(90deg,transparent,#5cdcff)}
  #scale{margin:8px 0 4px;padding:9px 11px;border:1px solid #2b6a86;border-radius:9px;background:linear-gradient(160deg,#0f2230,#0d1420)}
  #scale[hidden]{display:none}
  #scale .sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  #scale .sh b{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)} #scale .sh span{font-size:11px;color:var(--mut)}
  #scale .sg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  #scale .sg div{display:flex;flex-direction:column}
  #scale .sg span{font-size:10.5px;color:var(--mut)} #scale .sg b{font-size:17px;color:#fff;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  #scale .sg em{font-style:normal;font-size:10.5px;color:#66bb6a}
  #scale .sn{margin-top:7px;font-size:10.5px;line-height:1.4;color:var(--mut)}
  #arch{font-size:11.5px;color:var(--mut);margin:2px 2px 4px;line-height:1.35}
  #arch b{color:#ffd54f;font-weight:600}
  #ctrls .ct{margin:6px 0 2px;font-size:12px;color:var(--mut)}
  #ctrls .ct span{color:var(--fg);float:right}
  #ctrls input[type=range]{width:100%;accent-color:#5cdcff}
  #ctl .metricrow{margin-top:8px} #ctl .metricrow label{color:var(--mut);font-size:12px;white-space:nowrap}
  #bottom{position:fixed;left:396px;right:344px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
  #gallery{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
  #gallery:empty{display:none}
  #gallery figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 5px 3px;text-align:center}
  #gallery canvas{width:96px;height:96px;image-rendering:pixelated;display:block;border-radius:4px;background:#000}
  #gallery figcaption{font-size:10.5px;color:var(--mut);margin-top:3px;max-width:96px;line-height:1.2}
  #gallery figure.outcard{width:230px;text-align:left;padding:8px 10px 7px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box}
  .outcard .oh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  .outcard .oh b{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg)} .outcard .oh span{font-size:10.5px;color:var(--mut)}
  .outcard .orow{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
  .outcard .ol{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .outcard .ob{height:6px;background:#1c1c26;border-radius:3px;overflow:hidden} .outcard .ob i{display:block;height:100%;background:#3d6f86;border-radius:3px}
  .outcard .op{text-align:right;font-variant-numeric:tabular-nums}
  .outcard .orow.top{color:#fff;font-weight:600} .outcard .orow.top .ob i{background:var(--acc)} .outcard .orow.top .op{color:var(--acc)}
  .outcard .onote{margin-top:3px;font-size:10.5px;color:#ffb74d}
  .outcard .onote.il{color:var(--mut);font-style:italic}
  #gallery figcaption .il{display:block;font-style:italic;opacity:.75}
  #profcard{pointer-events:auto;position:relative;width:100%;max-width:680px;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);padding:8px 10px 6px}
  #profcard[hidden]{display:none}
  #profcard .ph{display:flex;align-items:baseline;gap:8px;margin:0 2px 2px;min-width:0}
  #profcard .pt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg);font-weight:600;white-space:nowrap}
  #profcard .ps{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #profcard .sp{flex:1}
  #pstat{font-size:11px;color:var(--mut);white-space:nowrap} #pstat b{color:var(--fg);font-weight:600}
  #pstat .bn{color:#ffd54f}
  #profile{display:block;width:100%;height:118px;cursor:crosshair}
  #ptip{position:absolute;pointer-events:none;z-index:2;background:#0d0d12f2;border:1px solid #2a2a35;border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.45;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.5);transform:translate(-50%,-100%)}
  #ptip[hidden]{display:none}
  #ptip b{color:#fff} #ptip .k{color:var(--mut)} #ptip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
  #legend .mbar{display:flex;align-items:center;gap:6px;width:100%;font-size:11px}
  #legend .mbar i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)}

  /* =================== blueprint theme (opt-in: Display › Theme) =================== */
  :root[data-theme=blueprint]{--bg:rgba(10,44,84,.86);--line:rgba(220,236,255,.38);--mut:#a9c4e2;--fg:#f2f8ff;--acc:#ffffff;--ctl:rgba(255,255,255,.05);
    --bp:#0e3a6b;--bp-hi:#16508f;--bp-ink:#eaf4ff;--bp-font:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif}
  :root[data-theme=blueprint] body{background:radial-gradient(ellipse at 50% 40%,var(--bp-hi) 0%,var(--bp) 55%,#0a2a50 100%);font-family:var(--bp-font)}
  :root[data-theme=blueprint] #gl{background-image:
      linear-gradient(rgba(234,244,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(234,244,255,.16) 1px,transparent 1px),
      linear-gradient(rgba(234,244,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(234,244,255,.06) 1px,transparent 1px);
    background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px}
  :root[data-theme=blueprint] #gl canvas{filter:grayscale(1) brightness(1.55) contrast(1.05);mix-blend-mode:screen}
  :root[data-theme=blueprint] .lb{color:var(--bp-ink);text-shadow:0 0 3px #0e3a6b,0 0 6px #0e3a6b;font-family:var(--bp-font)}
  :root[data-theme=blueprint] .lb b{color:#fff !important;letter-spacing:.04em} :root[data-theme=blueprint] .lb span{color:#bcd6f2}
  :root[data-theme=blueprint] #left > section,:root[data-theme=blueprint] #legend,:root[data-theme=blueprint] #panel,:root[data-theme=blueprint] #card,
  :root[data-theme=blueprint] #profcard,:root[data-theme=blueprint] #gallery figure,:root[data-theme=blueprint] #loading{
    background:var(--bg);border:1px solid var(--line);border-radius:2px;box-shadow:none}
  :root[data-theme=blueprint] #ctl .sec,:root[data-theme=blueprint] #legend .lh,:root[data-theme=blueprint] #profcard .pt{color:var(--bp-ink);letter-spacing:.16em}
  :root[data-theme=blueprint] #ctl .sec::after{background:var(--line)}
  :root[data-theme=blueprint] #ctl select,:root[data-theme=blueprint] #ctl button,:root[data-theme=blueprint] #ctl input:not([type]),
  :root[data-theme=blueprint] .chip,:root[data-theme=blueprint] .seg{border-color:rgba(234,244,255,.35) !important;border-radius:2px !important;background:transparent;color:var(--fg)}
  :root[data-theme=blueprint] #ctl select option{background:#0e3a6b}
  :root[data-theme=blueprint] #ctl button:hover:not(:disabled){background:rgba(255,255,255,.1)}
  :root[data-theme=blueprint] .chip:has(input:checked),:root[data-theme=blueprint] #ctl .vlist button.on,:root[data-theme=blueprint] #ctl .tabs button[aria-selected=true],
  :root[data-theme=blueprint] .seg button.on{background:rgba(255,255,255,.16) !important;color:#fff !important;border-color:#fff !important}
  :root[data-theme=blueprint] .chip:has(input:checked)::before,:root[data-theme=blueprint] #ctl .vlist button.on i{background:#fff;border-color:#fff}
  :root[data-theme=blueprint] #ctl .tabs{background:transparent;border-color:var(--line);border-radius:2px}
  :root[data-theme=blueprint] #ctl .learnbtn{background:transparent !important;border-color:#fff !important;color:#fff}
  :root[data-theme=blueprint] #ctl .learnbtn svg{color:#fff}
  :root[data-theme=blueprint] #title .nm{text-shadow:none;font-family:var(--bp-font);letter-spacing:.06em;text-transform:uppercase}
  :root[data-theme=blueprint] #title .ln{background:#fff}
  :root[data-theme=blueprint] #pred{background:transparent;border-color:#fff;color:#fff;border-radius:2px}
  :root[data-theme=blueprint] #scale{background:transparent;border-color:#fff;border-radius:2px}
  :root[data-theme=blueprint] #scale .sh b,:root[data-theme=blueprint] .outcard .orow.top .op{color:#fff}
  :root[data-theme=blueprint] .outcard .ob{background:rgba(255,255,255,.12)} :root[data-theme=blueprint] .outcard .ob i{background:rgba(255,255,255,.55)}
  :root[data-theme=blueprint] .outcard .orow.top .ob i{background:#fff}
  :root[data-theme=blueprint] #hint{color:#a9c4e2}
  :root[data-theme=blueprint] .modal .hc{background:#0c3360;border-color:var(--line);border-radius:3px}
  /* drawing sheet: double border, zone markers, title block */
  #sheet{display:none;position:fixed;inset:5px;pointer-events:none;border:1.5px solid rgba(234,244,255,.75);z-index:1}
  #sheet::before{content:"";position:absolute;inset:14px;border:1px solid rgba(234,244,255,.45)}
  #sheet .z{position:absolute;font:10px var(--bp-font);color:rgba(234,244,255,.7);letter-spacing:.1em}
  :root[data-theme=blueprint] #sheet{display:block}
  :root[data-theme=blueprint] #left{left:26px;top:26px} :root[data-theme=blueprint] #legend{left:26px;bottom:26px}
  :root[data-theme=blueprint] #title{right:30px;top:26px} :root[data-theme=blueprint] #hint{right:30px;bottom:26px}
  #tblock{display:none;position:fixed;right:30px;bottom:48px;z-index:2;pointer-events:none;font-family:var(--bp-font);color:var(--bp-ink);
          border:1.5px solid rgba(234,244,255,.85);background:rgba(10,44,84,.72);border-collapse:collapse;font-size:10.5px;min-width:340px}
  :root[data-theme=blueprint] #tblock{display:table}
  :root[data-theme=blueprint] body:has(#panel[style*="block"]) #tblock{display:none}
  #tblock td{border:1px solid rgba(234,244,255,.5);padding:3px 8px;vertical-align:top}
  #tblock small{display:block;font-size:8.5px;letter-spacing:.14em;color:#a9c4e2;text-transform:uppercase}
  #tblock b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  #tblock .big b{font-size:16px}
  /* ---- control panel v2: header, tabs, groups ---- */
  #ctl header{align-items:center;padding:9px 10px 0 13px}
  #ctl .ver{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:2px}
  #ctl .hbtn{width:26px;height:26px;padding:0 !important;display:grid;place-items:center;border-radius:50% !important;font-weight:700;font-size:13px;line-height:1}
  #ctl #helpbtn{color:var(--acc);border-color:#2b6a86 !important}
  #ctl #helpbtn.pulse{animation:pulse 1.8s ease-out 3}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(92,220,255,.55)}100%{box-shadow:0 0 0 10px rgba(92,220,255,0)}}
  #ctl .tabs{display:flex;gap:2px;margin:9px 10px 0;padding:3px;background:#0e0e13;border:1px solid var(--line);border-radius:8px}
  #ctl .tabs button{flex:1;border:0 !important;background:transparent;color:var(--mut);padding:5px 0;font-size:12px;border-radius:6px !important;transition:background .15s,color .15s}
  #ctl .tabs button:hover{color:var(--fg);background:#16161d}
  #ctl .tabs button[aria-selected=true]{background:#1a2a34;color:var(--acc)}
  #ctl.closed .tabs{display:none}
  #ctl .pane{display:none} #ctl .pane.on{display:block;animation:fade .15s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
  #ctl .sec:first-child{margin-top:4px}
  #ctl .learnbtn{display:flex;align-items:center;gap:6px;height:26px;padding:0 11px !important;border-radius:999px !important;font-size:12px;font-weight:600;
                 color:#d8f6ff;background:linear-gradient(135deg,#173445,#1d2a4a) !important;border-color:#2b6a86 !important}
  #ctl .learnbtn:hover{background:linear-gradient(135deg,#1d4256,#25345c) !important}
  #ctl .learnbtn svg{color:var(--acc)}
  /* ---- learn (course) dialog ---- */
  #learn .hc{width:min(940px,100%);height:min(680px,calc(100vh - 32px))}
  #learn .lw{display:flex;flex:1;min-height:0}
  #learn nav{width:210px;flex:none;border-right:1px solid #1c1c24;padding:10px 8px;overflow:auto}
  #learn nav .part{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:6px 8px 6px}
  #learn nav button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:#b9b9c4;font:inherit;font-size:13px;padding:7px 8px;border-radius:7px;cursor:pointer}
  #learn nav button:hover{background:#15151c;color:var(--fg)}
  #learn nav button.on{background:#14222b;color:var(--acc)}
  #learn nav button em{font-style:normal;font-size:11px;color:var(--mut);width:14px;flex:none}
  #learn nav button.on em{color:var(--acc)}
  #learn .lc{flex:1;min-width:0;display:flex;flex-direction:column}
  #learn .hb{flex:1;padding:4px 22px 10px;font-size:13.5px}
  #learn h2{margin:6px 22px 0}
  #learn .lede{font-size:14.5px;color:#e2e2ea;margin:8px 0 12px}
  #learn h4{margin:16px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
  #learn figure{margin:12px 0;padding:12px;background:#0a0a0e;border:1px solid #1c1c24;border-radius:10px;text-align:center}
  #learn figure svg{max-width:100%;height:auto}
  #learn figcaption{font-size:11.5px;color:var(--mut);margin-top:6px}
  #learn .try{margin:14px 0 4px;padding:10px 12px;border-left:3px solid var(--acc);background:#0f1b22;border-radius:0 8px 8px 0}
  #learn .try b{color:var(--acc)}
  #learn .eq{font:13px ui-monospace,Consolas,monospace;color:#9fe;background:#0b1714;border:1px solid #173a31;border-radius:6px;padding:6px 10px;margin:8px 0;display:block;overflow-x:auto;white-space:nowrap}
  #learn table.kv td{border-bottom:1px solid #1c1c24;padding:5px 6px;vertical-align:top}
  #learn table.kv td:first-child{width:auto;white-space:nowrap;color:var(--fg)}
  #learn .hf .prog{flex:1;height:3px;background:#1c1c24;border-radius:2px;overflow:hidden}
  #learn .hf .prog i{display:block;height:100%;background:var(--acc);transition:width .2s}

<script>
"use strict";
const KIND = {
  input:      {color:"#ffffff", label:"Input",        desc:"Image as a single slab"},
  conv:       {color:"#26c6da", label:"Convolution",  desc:"C slabs; a k×k×C_in kernel cuboid slides over the input"},
  linear:     {color:"#66bb6a", label:"Linear",       desc:"Column of neurons, dense weight lines"},
  attention:  {color:"#ab47bc", label:"Attention",    desc:"X → Q,K,V → per-head softmax(QKᵀ) maps → ·V → concat → W_o"},
  norm:       {color:"#ffca28", label:"Normalization",desc:"Cage that rescales the tensor"},
  activation: {color:"#ff9800", label:"Activation",   desc:"Gate plate showing the function"},
  pool:       {color:"#bcaaa4", label:"Pooling",      desc:"Sliding window, no weights"},
  op:         {color:"#90a4ae", label:"Tensor op",    desc:"Reshape / reduce / add"},
  embedding:  {color:"#4db6ac", label:"Embedding",    desc:"Lookup table: token id → vector"},
  moe:        {color:"#d4e157", label:"Mixture of experts", desc:"Router plane (tokens × experts), top-k experts per token"},
  upsample:   {color:"#5c6bc0", label:"Up-sampling",  desc:"Enlarges spatial size, no parameters"},
  group:      {color:"#b0bec5", label:"Collapsed block", desc:"Repeated block shown as one node (double-click to expand)"},
  output:     {color:"#ffffff", label:"Output",       desc:"Logits"},
};
const CELL = 0.5, SLAB = 0.75;
const BASE = [38,38,54], HI = [90,220,255], NEG = [255,79,163];
const T = THREE;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
function fmtParams(n){
  if (n == null) return "?";
  if (n < 1e3) return `${n}`;
  if (n < 1e6) return `${(n/1e3).toFixed(n < 1e4 ? 1 : 0)} K`;
  if (n < 1e9) return `${(n/1e6).toFixed(n < 1e7 ? 2 : 1)} M`;
  return `${(n/1e9).toFixed(2)} B`;
}
const lerp = (a,b,t) => a + (b-a)*t;
function divColor(a){
  const t = clamp(Math.abs(a), 0, 1), c = a >= 0 ? HI : NEG;
  return new T.Color(lerp(BASE[0],c[0],t)/255, lerp(BASE[1],c[1],t)/255, lerp(BASE[2],c[2],t)/255);
}
const cssDiv = a => { const c = divColor(a); return `rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`; };

// ---------- three setup ----------
const host = document.getElementById("gl");
const renderer = new T.WebGLRenderer({antialias:true, preserveDrawingBuffer:true, alpha:true});
renderer.setPixelRatio(1);   // 'easy rendering' is on by default
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x000000);
const camera = new T.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 2000);
const controls = new T.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.addEventListener("change", () => { needsRender = true; });
let world = new T.Group(); scene.add(world);
addEventListener("resize", () => { needsRender = true; renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); });

// ---------- state ----------
let G, A = null, nodeBy = {}, inc = {}, sel = null, seed = 0;
let sweeps = [], labels = [], pickers = [], manyNodes = false, needsRender = true;
const MODELS = {};
const FLOORCOL = ["#4fc3f7", "#aed581", "#ffb74d", "#ba68c8", "#4db6ac", "#f06292", "#fff176", "#90a4ae"];
let G0 = null, metricRange = null, paramVals = {}, visSpine = [];
const expanded = new Set();

const cellY = (g, r) => g.oy + (g.H-1-r)*CELL + CELL/2;
const cellZ = (g, c) => g.oz + c*CELL + CELL/2;
const slabX = (g, c) => g.ox + c*SLAB;
const Wp = (n, v) => n.grp.localToWorld(v.clone());
const HEADCOL = ["#e1bee7", "#9fa8da", "#f48fb1", "#80deea"];
function cellPos(n, c, r, col){ const g = n.g; return new T.Vector3(slabX(g,c), cellY(g,r), cellZ(g,col)); }
function unitPos(n, i){

function blockId(p){

  const sg = p.split(".");

}
function makeView(){

  const ins = {}; rawEdges.forEach(e => (ins[e.dst] ||= []).push(e.src));
  const all = {};
  raw.forEach(n => { const id = blockId(n.path); if (id) all[n.name] = id; });
  raw.forEach(n => {                       // ops without a module path join the block of their latest input
    if (all[n.name] || n.kind === "input" || n.kind === "output") return;
    const i = ins[n.name] || []; if (!i.length) return;
    const last = i.reduce((a, b) => idx[a] > idx[b] ? a : b);
    if (all[last]) all[n.name] = all[last];

  Object.keys(all).forEach(k => { if (cnt[all[k]] < 2) delete all[k]; });     // singletons are not blocks
  const collapsed = {};
  if ($("grpblocks").checked) Object.keys(all).forEach(k => { if (!expanded.has(all[k])) collapsed[k] = all[k]; });
  const members = {};
  raw.forEach(n => { const g = collapsed[n.name]; if (g) (members[g] ||= []).push(n); });

// ---------- layout ----------
function layout(){

  G.edges.forEach(e => inc[e.dst].push(e.src));

    visiting.delete(n.name);

    const s = n.dshape;      // batch-free, sampled for display

        : s.length === 2 ? {type:"grid", C:1, H:s[0], W:s[1]}

    if (n.moe){ n.b.off = 4; n.b.sx = 4 + g.sx; n.b.sz = Math.max(g.sz, Math.min(n.moe, 32)*CELL); }

// poses: world = P + R(yaw)·(local − (cx,0,0)); each depth column is one station on the path
function arrange(mode){

  G.nodes.forEach(n => { if ((n.kind === "conv" || n.kind === "pool") && (all || n === sel)) addSweep(n, n.kind); });
  needsRender = true;
}

function updateSweeps(time, on){
  sweeps.forEach(s => {
    s.box.visible = s.marker.visible = s.line.visible = on;
    if (!on) return;
    const per = s.H*s.W, step = Math.floor(time*7), idx = step % per;
    const ch = Math.floor(step/per) % s.C;
    const oh = Math.floor(idx / s.W), ow = idx % s.W;
    const rc = (oh + 0.5)*(s.src.g.H/s.H) - 0.5, cc = (ow + 0.5)*(s.src.g.W/s.W) - 0.5;
    const sg = s.src.g, inCh = s.kind === "conv" ? (s.cin-1)/2 : Math.min(ch, sg.C-1);
    s.box.position.copy(Wp(s.src, new T.Vector3(sg.ox + inCh*SLAB, sg.oy + (sg.H-1-rc)*CELL + CELL/2, sg.oz + cc*CELL + CELL/2)));
    s.box.quaternion.copy(s.src.grp.quaternion);
    const out = Wp(s.n, cellPos(s.n, ch, oh, ow));
    s.marker.position.copy(out); s.marker.quaternion.copy(s.n.grp.quaternion);
    const p = s.line.geometry.attributes.position;
    p.setXYZ(0, s.box.position.x, s.box.position.y, s.box.position.z); p.setXYZ(1, out.x, out.y, out.z);
    p.needsUpdate = true;
  });
}

function metricValue(n, m){
  const a = A && A.acts[n.actKey || n.name];
  switch (m){
    case "params": return n.params > 0 ? n.params : null;
    case "flops": return n.flops > 0 ? n.flops : null;
    case "size": return n.numel;
    case "sparsity": return a && a.stats ? a.stats.sparsity : null;
    case "mean_abs": return a && a.stats ? a.stats.mean_abs : null;
    case "residual": return a && a.delta != null ? a.delta : null;
  }
  return null;
}
const METRIC_LOG = {params: true, flops: true, size: true, mean_abs: true, residual: true, sparsity: false};
function computeMetricRange(){
  const m = $("metric").value;
  metricRange = null;
  if (m === "type") return;
  const vals = G.nodes.map(n => metricValue(n, m)).filter(v => v != null && isFinite(v));
  if (!vals.length) return;
  const f = METRIC_LOG[m] ? (v => Math.log10(Math.max(v, 1e-9))) : (v => v);
  metricRange = {m, f, lo: Math.min(...vals.map(f)), hi: Math.max(...vals.map(f)), raw: [Math.min(...vals), Math.max(...vals)]};
}
function rampColor(t){
  const S = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]], x = t*4, i = Math.min(3, Math.floor(x)), f = x - i;
  return new T.Color(lerp(S[i][0], S[i+1][0], f)/255, lerp(S[i][1], S[i+1][1], f)/255, lerp(S[i][2], S[i+1][2], f)/255);
}
function metricColor(n){
  if (!metricRange) return null;
  const v = metricValue(n, metricRange.m);
  if (v == null || !isFinite(v)) return new T.Color(0x3a3a46);
  return rampColor(clamp((metricRange.f(v) - metricRange.lo) / (metricRange.hi - metricRange.lo + 1e-9), 0, 1));
}

function buildNode(n, acts, showAct){
  const k = KIND[n.kind], g = n.g, a = acts && acts[n.actKey || n.name];
  const t = a && a.tensor;

  const get = (c,r,col) => showAct ? tensorVal(t, g, c, r, col) : 0;
  if (showAct && t) { const f = JSON.stringify; mx = Math.max(1e-6, ...(t.flat(3).map(Math.abs))); }
  for (let c = 0; c < g.C; c++) for (let r = 0; r < g.H; r++) for (let col = 0; col < g.W; col++)
    items.push({p: cellPos(n, c, r, col), c: showAct && t ? divColor(get(c,r,col)/mx) : divColor(0)});
  n.grp.add(makeCells(items, g.type === "vec" && n.kind !== "output" ? geoSphere : geoBox));
  const cx = g.ox + (g.C-1)*SLAB/2, cy = g.oy + g.sy/2, cz = g.oz + g.sz/2;
  const pad = n.kind === "norm" ? 0.45 : 0.15;
  const mcol = metricColor(n), ocol = mcol || new T.Color(k.color);
  n.grp.add(outline(cx, cy, cz, g.sx + pad + 0.1, g.sy + pad, g.sz + pad, ocol));
  if (n.kind === "norm") n.grp.add(outline(cx, cy, cz, g.sx + 0.1, g.sy + 0.2, g.sz + 0.2, ocol));
  if (n.kind === "group") n.grp.add(outline(cx, cy, cz, g.sx + 0.9, g.sy + 0.9, g.sz + 0.9, ocol));
  if (mcol){
    const halo = new T.Mesh(new T.BoxGeometry(g.sx + 0.5, g.sy + 0.5, g.sz + 0.5),
                            new T.MeshBasicMaterial({color: mcol, transparent: true, opacity: 0.22, depthWrite: false}));
    halo.position.set(cx, cy, cz); n.grp.add(halo);

  if (n.kind === "activation"){

    plate.rotation.y = -Math.PI/2;   // faces the input side; curve reads left→right looking along the flow

    const mx = M ? Math.max(1e-6, ...M.flat()) : 1, items = [];
    for (let r = 0; r < Tn; r++) for (let c = 0; c < E; c++)
      items.push({p: new T.Vector3(n.b.ox, (Tn-1-r)*CELL - Tn*CELL/2 + CELL/2, zc - E*CELL/2 + c*CELL + CELL/2),
                  c: divColor(M ? M[r][c]/mx : 0)});
    n.grp.add(makeCells(items, geoBox));
    n.grp.add(outline(n.b.ox, 0, zc, 0.12, Tn*CELL + 0.15, E*CELL + 0.15, new T.Color(k.color)));
    addLabel(n, "router: tokens × experts", new T.Vector3(n.b.ox, Tn*CELL/2 + 0.9, zc), "#e6ee9c", "", true);
  }
  if (n.kind === "output"){
    if (n.units === G.classes.length && n.g.H === n.units) G.classes.forEach((c, i) => addLabel(n, c, cellPos(n, 0, i, 0).add(new T.Vector3(0, 0, 0.9)), "#ccc", "", true));

  pk.userData.node = n; n.grp.add(pk); pickers.push(pk);
  addLabel(n, n.name, new T.Vector3(n.b.ox + n.b.sx/2, n.b.oy + n.b.sy + 0.5, n.b.oz + n.b.sz/2), k.color,
           `${n.label} · [${n.tshape.join("×")}]${n.sampled ? "*" : ""}` + (n.headPlanes ? (() => {
             const tot = n.attrs.heads || n.attrs.num_heads || n.headPlanes;
             return ` · ${tot} heads` + (n.attrs.kv_heads && n.attrs.kv_heads !== tot ? ` / ${n.attrs.kv_heads} KV` : "") +
                    (n.attrs.window ? ` · window ${n.attrs.window}` : "") + (tot > n.headPlanes ? ` (${n.headPlanes} shown)` : ""); })() : "") +
           (n.moe ? ` · ${n.attrs.num_experts} experts, top-${n.attrs.top_k}` : ""), false, n);

function buildAttention(n, a, showAct){
  const g = n.g, b = n.b, att = n.att, Tn = g.H, D = g.W, H = n.heads, dh = D/H, grp = n.grp;
  const zmid = b.oz + b.sz/2, qkv = showAct && a && a.qkv, hm = showAct && a && a.attn;
  const kc = new T.Color(KIND.attention.color), hc = h => new T.Color(HEADCOL[h % HEADCOL.length]);
  const laneZ = l => zmid + (l-1)*(g.sz + att.gap);
  const colZ = (zc, hh) => zc - D*CELL/2 + (hh*dh + dh/2)*CELL;     // centre of head hh's columns
  const items = (M, x, zc, rows, cols) => {
    const mx = M ? Math.max(1e-6, ...M.flat().map(Math.abs)) : 1, out = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      out.push({p: new T.Vector3(x, (rows-1-r)*CELL - rows*CELL/2 + CELL/2, zc - cols*CELL/2 + c*CELL + CELL/2),
                c: divColor(M ? M[r][c]/mx : 0)});
    return out;
  };
  const block = (M, x, zc, rows, cols, thick, headCols) => {
    grp.add(makeCells(items(M, x, zc, rows, cols), geoBox));
    grp.add(outline(x, 0, zc, thick, rows*CELL + 0.15, cols*CELL + 0.15, kc));
    if (headCols) for (let h = 0; h < H; h++)
      grp.add(outline(x, 0, colZ(zc, h), thick + 0.1, rows*CELL + 0.35, dh*CELL, hc(h)));
  };
  const lbl = (text, x, zc, y) => addLabel(n, text, new T.Vector3(x, y ?? (Tn*CELL/2 + 0.9), zc), "#d1a8e0", "", true);
  const qx = b.ox + att.qx, cx = b.ox + att.cx;
  [["q", "Q = X·W_q"], ["k", "K = X·W_k"], ["v", "V = X·W_v"]].forEach(([key, text], l) => {
    block(qkv && qkv[key], qx, laneZ(l), Tn, D, 0.12, true);
    lbl(text, qx, laneZ(l));
  });
  for (let h = 0; h < H; h++){
    const x = b.ox + att.hx + h*SLAB;
    block(hm && hm[h], x, zmid, Tn, Tn, 0.12, false);
    grp.add(outline(x, 0, zmid, 0.2, Tn*CELL + 0.3, Tn*CELL + 0.3, hc(h)));
  }
  lbl("softmax(Q·Kᵀ/√d) per head", b.ox + att.hx + H*SLAB/2, zmid, Tn*CELL/2 + 1.6);
  block(qkv && qkv.ctx, cx, zmid, Tn, D, 0.12, true);
  lbl("A·V (heads concat) → W_o", cx, zmid);
  // data flow inside the block, one colour per head
  for (let h = 0; h < H; h++){
    const pts = [], P = new T.Vector3(b.ox + att.hx + h*SLAB, 0, zmid);
    const q = new T.Vector3(qx + 0.1, 0, colZ(laneZ(0), h)), k = new T.Vector3(qx + 0.1, 0, colZ(laneZ(1), h));
    const v = new T.Vector3(qx + 0.1, 0, colZ(laneZ(2), h)), c = new T.Vector3(cx - 0.1, 0, colZ(zmid, h));
    [[q, P], [k, P], [P, c], [v, c]].forEach(([u, w]) => pts.push(u.x, u.y, u.z, w.x, w.y, w.z));
    const geo = new T.BufferGeometry(); geo.setAttribute("position", new T.Float32BufferAttribute(pts, 3));
    grp.add(new T.LineSegments(geo, new T.LineBasicMaterial({color: hc(h), transparent: true, opacity: 0.55})));
  }
}

function addLabel(n, text, pos, color, sub, small, node){

  d.innerHTML = `<b style="color:${color};${small?"font-size:11px;font-weight:500":""}">${text}</b>${sub ? `<span>${sub}</span>` : ""}`;

const dispUnits = n => n.g.type === "vol" ? n.g.C : n.g.type === "grid" ? n.g.W : n.g.H;
function buildEdges(showW){
  const flow = [], unit = [], unitCol = [], skip = [], skipEdges = [];
  const order = {}; G.nodes.forEach((n, i) => order[n.name] = i);
  const bIdx = G.analysis && G.analysis.bottleneck ? order[G.rep[G.analysis.bottleneck]] : null;
  const spineSet = new Set(G.analysis ? G.analysis.spine.map(nm => G.rep[nm]) : []);
  const push = (arr, p) => arr.push(p.x, p.y, p.z);
  const easy = $("easy").checked, thin = easy && manyNodes;
  const addU = (p, q, w, ident) => {
    if (!ident && thin && Math.abs(w) < 0.25) return;      // keep only the strong weights
    push(unit, p); push(unit, q);
    const al = ident ? 0.35 : 0.12 + 0.88*Math.abs(w);
    const c = ident ? [0.6,0.65,0.75] : (w >= 0 ? [1,1,1] : [1,0.31,0.64]);
    unitCol.push(c[0]*al, c[1]*al, c[2]*al, c[0]*al, c[1]*al, c[2]*al);
  };
  G.edges.forEach(e => {
    const a = nodeBy[e.src], b = nodeBy[e.dst], ga = a.g, gb = b.g;
    const pa = Wp(a, new T.Vector3(ga.ox + ga.sx, ga.oy + ga.sy/2, ga.oz + ga.sz/2));
    const pb = Wp(b, new T.Vector3(b.b.ox, gb.oy + gb.sy/2, gb.oz + gb.sz/2));
    if (e.skip){
      const p0 = Wp(a, new T.Vector3(ga.ox + ga.sx/2, ga.oy + ga.sy + 0.3, ga.oz + ga.sz/2));
      const p2 = Wp(b, new T.Vector3(b.b.ox + b.b.sx/2, gb.oy + gb.sy + 0.3, gb.oz + gb.sz/2));
      // long arcs (spiral / folded layouts) must visibly arch over the model instead of reading as straight chords
      const mid = p0.clone().add(p2).multiplyScalar(0.5); mid.y += 6 + p0.distanceTo(p2)*0.28;
      // only concatenation skips are "bypassing" the bottleneck; adds fed from a side branch (e.g. the timestep
      // embedding) are conditioning, not information shortcuts
      const crosses = e.join === "cat" && bIdx != null && order[e.src] < bIdx && bIdx < order[e.dst];
      skipEdges.push({curve: new T.QuadraticBezierCurve3(p0, mid, p2), join: e.join || "add", ch: a.units, crosses,
                      side: !spineSet.has(e.src), src: e.src, dst: e.dst});
      return;
    }
    push(flow, pa); push(flow, pb);
    if (!showW) return;
    if (b.headPlanes && b.weights.qkv[0].length === a.g.W){              // X -> Q,K,V (real W_q,W_k,W_v) and ctx -> out (W_o)
      const att = b.att, D = b.g.W, Wq = b.weights.qkv, Wo = b.weights.o;
      const mx = Math.max(1e-9, ...Wq.flat().map(Math.abs), ...Wo.flat().map(Math.abs));
      const zmid = b.b.oz + b.b.sz/2, laneZ = l => zmid + (l-1)*(b.g.sz + att.gap);
      for (let l = 0; l < 3; l++) for (let j = 0; j < D; j++) for (let i = 0; i < Wq[0].length; i++)
        addU(Wp(a, unitPos(a, i)), Wp(b, new T.Vector3(b.b.ox + att.qx, 0, laneZ(l) - D*CELL/2 + j*CELL + CELL/2)),
             Wq[l*D + j][i]/mx, false);
      for (let i = 0; i < D; i++) for (let j = 0; j < D; j++)
        addU(Wp(b, new T.Vector3(b.b.ox + att.cx, 0, zmid - D*CELL/2 + i*CELL + CELL/2)), Wp(b, unitPos(b, j)), Wo[j][i]/mx, false);
      return;
    }
    if (e.mode === "dense"){
      const lim = easy ? (b.units > 256 ? 40 : 150) : 600;      // e.g. the 1000-way classifier head
      e.sparse.slice(0, lim).forEach(([i,j,w]) => addU(Wp(a, unitPos(a,i)), Wp(b, unitPos(b,j)), w, false));
    } else if (e.mode === "identity" && !thin) for (let i = 0; i < Math.min(dispUnits(a), dispUnits(b)); i++) addU(Wp(a, unitPos(a,i)), Wp(b, unitPos(b,i)), 0, true);
  });
  G.skipCurves = skipEdges;                                  // kept for the selection highlight
  const mk = (arr, mat) => { const geo = new T.BufferGeometry();
    geo.setAttribute("position", new T.Float32BufferAttribute(arr, 3)); return [geo, new T.LineSegments(geo, mat)]; };
  world.add(mk(flow, new T.LineBasicMaterial({color: 0x556070, transparent: true, opacity: 0.8}))[1]);
  const JC = {cat: 0x4dd0e1, add: 0xffffff, mul: 0xffb74d, bypass: 0xffd54f, side: 0xb39ddb};
  const arcKey = sk => sk.crosses ? "bypass" : sk.join === "cat" ? "cat" : sk.side ? "side" : (sk.join === "mul" ? "mul" : "add");
  if (skipEdges.length <= 60){
    skipEdges.forEach(sk => {
      const r = clamp(0.05 + 0.03*Math.log2(Math.max(2, sk.ch)), 0.06, 0.32);
      world.add(new T.Mesh(new T.TubeGeometry(sk.curve, 40, sk.crosses ? r*1.4 : r, 6, false),
        new T.MeshBasicMaterial({color: JC[arcKey(sk)], transparent: true, opacity: 0.8})));
    });
  } else {
    const by = {};
    skipEdges.forEach(sk => { const a2 = (by[arcKey(sk)] ||= []), pts = sk.curve.getPoints(24);
      for (let i = 0; i < pts.length-1; i++){ push(a2, pts[i]); push(a2, pts[i+1]); } });
    Object.entries(by).forEach(([j, arr]) => world.add(mk(arr, new T.LineBasicMaterial({color: JC[j] || 0xffffff, transparent: true, opacity: 0.55}))[1]));
  }
  if (unit.length){
    const [geo, l] = mk(unit, new T.LineBasicMaterial({vertexColors: true, transparent: true, blending: T.AdditiveBlending, depthWrite: false}));
    geo.setAttribute("color", new T.Float32BufferAttribute(unitCol, 3)); world.add(l);
  }
}

// selecting a layer / block lights up its skip connections and outlines the layer at the other end of each one
let hlObjs = [], hlLabels = [];
const HLCOL = 0x76ff03;
function clearHighlight(){
  hlObjs.forEach(o => { if (o.parent) o.parent.remove(o); if (o.geometry) o.geometry.dispose(); });
  hlLabels.forEach(l => { l.d.remove(); const i = labels.indexOf(l); if (i >= 0) labels.splice(i, 1); });
  hlObjs = []; hlLabels = [];
}
function refreshHighlight(){
  clearHighlight();
  needsRender = true;
  if (!sel || !G.skipCurves || folding) return;
  const seen = new Set();
  G.skipCurves.filter(s => s.src === sel.name || s.dst === sel.name).forEach(s => {
    const tube = new T.Mesh(new T.TubeGeometry(s.curve, 48, 0.3, 8, false),
                            new T.MeshBasicMaterial({color: HLCOL, depthTest: false, transparent: true}));
    tube.renderOrder = 10; world.add(tube); hlObjs.push(tube);
    const p = nodeBy[s.src === sel.name ? s.dst : s.src];
    if (!p || p === sel || seen.has(p.name)) return;
    seen.add(p.name);
    const b = p.b, box = outline(b.ox + b.sx/2, b.oy + b.sy/2, b.oz + b.sz/2, b.sx + 1, b.sy + 1, b.sz + 1, HLCOL);
    box.material.depthTest = false; box.renderOrder = 10;

             new T.Vector3(b.ox + b.sx/2, b.oy + b.sy + 1.6, b.oz + b.sz/2), "#76ff03", "", true, p);
    const l = labels[labels.length - 1]; l.always = true; hlLabels.push(l);

}

// bake every node's cells and outlines into one instanced mesh per geometry + one line buffer
function mergeStatic(){
  world.updateMatrixWorld(true);
  const inst = new Map(), lp = [], lc = [];
  const m = new T.Matrix4(), c = new T.Color(), v = new T.Vector3();
  G.nodes.forEach(n => {
    [...n.grp.children].forEach(o => {
      if (o.isInstancedMesh){
        let e = inst.get(o.geometry); if (!e) inst.set(o.geometry, e = {mats: [], cols: []});
        for (let k = 0; k < o.count; k++){
          o.getMatrixAt(k, m); m.premultiply(o.matrixWorld);
          e.mats.push(m.clone()); e.cols.push(c.fromArray(o.instanceColor.array, k*3).clone());
        }
        n.grp.remove(o); o.dispose();
      } else if (o.isLineSegments && !o.material.vertexColors && !o.material.transparent){
        const pos = o.geometry.attributes.position, col = o.material.color;
        for (let k = 0; k < pos.count; k++){
          v.fromBufferAttribute(pos, k).applyMatrix4(o.matrixWorld); lp.push(v.x, v.y, v.z); lc.push(col.r, col.g, col.b);
        }
        n.grp.remove(o); o.geometry.dispose();
      }
    });
  });
  inst.forEach((e, geo) => {
    const mesh = new T.InstancedMesh(geo, matCell, e.mats.length);
    e.mats.forEach((mm, i) => { mesh.setMatrixAt(i, mm); mesh.setColorAt(i, e.cols[i]); });
    mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true; mesh.frustumCulled = false;
    world.add(mesh);
  });
  if (lp.length){
    const geo = new T.BufferGeometry();
    geo.setAttribute("position", new T.Float32BufferAttribute(lp, 3));
    geo.setAttribute("color", new T.Float32BufferAttribute(lc, 3));
    const l = new T.LineSegments(geo, new T.LineBasicMaterial({vertexColors: true}));
    l.frustumCulled = false; world.add(l);
  }
}

function buildAnalysis(){
  visSpine = [];
  const an = G.analysis;
  if (!an) return;
  const rep_ = G.rep, vis = [];
  an.spine.forEach(nm => { const v = nodeBy[rep_[nm]]; if (v && vis[vis.length - 1] !== v) vis.push(v); });
  if (vis.length < 2) return;
  visSpine = vis;
  const cen = v => Wp(v, new T.Vector3(v.b.ox + v.b.sx/2, v.b.oy + v.b.sy/2, v.b.oz + v.b.sz/2));
  const P = vis.map(cen), logs = vis.map(v => Math.log10(Math.max(1, v.numel)));
  const lo = Math.min(...logs), hi = Math.max(...logs);
  const R = logs.map(l => 1.6 + 5.2*(l - lo)/(hi - lo + 1e-9));
  const tang = i => { const a = P[Math.max(0, i-1)], b = P[Math.min(P.length-1, i+1)]; return b.clone().sub(a).normalize(); };
  const dists = []; for (let i = 0; i < P.length-1; i++) dists.push(P[i].distanceTo(P[i+1]));
  const med = dists.slice().sort((a, b) => a - b)[dists.length >> 1] || 1, maxJump = 2.6*med + 12;

  if ($("showenv").checked){
    // follow a smooth curve through the stations (a straight polyline cuts corners on a spiral / folded layout)
    const SUB = P.length > 2 ? 8 : 1, SEG = 24, S = [], RS = [], segOf = [];
    if (P.length > 2){
      const curve = new T.CatmullRomCurve3(P, false, "centripetal");
      const total = (P.length - 1)*SUB;
      for (let j = 0; j <= total; j++){
        S.push(curve.getPoint(j/total));
        const f = j/SUB, i0 = Math.min(P.length - 2, Math.floor(f)), u = f - i0;
        RS.push(lerp(R[i0], R[i0 + 1], u)); segOf.push(i0);
      }
    } else P.forEach((p, i) => { S.push(p); RS.push(R[i]); segOf.push(Math.min(i, P.length - 2)); });
    const tangS = j => S[Math.min(S.length - 1, j + 1)].clone().sub(S[Math.max(0, j - 1)]).normalize();
    const pos = [], idxs = [], wire = [];
    S.forEach((p, j) => {
      const t = tangS(j), up = Math.abs(t.y) > 0.9 ? new T.Vector3(1, 0, 0) : new T.Vector3(0, 1, 0);
      const u = new T.Vector3().crossVectors(t, up).normalize(), w = new T.Vector3().crossVectors(t, u).normalize();
      for (let k = 0; k < SEG; k++){
        const th = k/SEG*Math.PI*2, q = p.clone().addScaledVector(u, Math.cos(th)*RS[j]).addScaledVector(w, Math.sin(th)*RS[j]);
        pos.push(q.x, q.y, q.z);
      }
    });
    for (let j = 0; j < S.length - 1; j++){
      if (dists[segOf[j]] > maxJump) continue;
      for (let k = 0; k < SEG; k++){
        const a1 = j*SEG + k, b1 = j*SEG + (k+1) % SEG, c1 = (j+1)*SEG + k, d1 = (j+1)*SEG + (k+1) % SEG;
        idxs.push(a1, b1, c1, b1, d1, c1);
      }
    }
    for (let j = 0; j < S.length; j += (P.length > 2 ? SUB : 1)) for (let k = 0; k < SEG; k++){   // rings only at the stations
      const a1 = (j*SEG + k)*3, b1 = (j*SEG + (k+1) % SEG)*3;
      wire.push(pos[a1], pos[a1+1], pos[a1+2], pos[b1], pos[b1+1], pos[b1+2]);
    }
    const g1 = new T.BufferGeometry();
    g1.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g1.setIndex(idxs);
    world.add(new T.Mesh(g1, new T.MeshBasicMaterial({color: 0x6aa6ff, transparent: true, opacity: 0.07, side: T.DoubleSide, depthWrite: false})));
    const g2 = new T.BufferGeometry(); g2.setAttribute("position", new T.Float32BufferAttribute(wire, 3));
    world.add(new T.LineSegments(g2, new T.LineBasicMaterial({color: 0x6aa6ff, transparent: true, opacity: 0.22})));
  }

  const bn = an.bottleneck && nodeBy[rep_[an.bottleneck]];
  if (bn){
    const i = vis.indexOf(bn);
    if (i >= 0){
      const ring = new T.Mesh(new T.TorusGeometry(R[i] + 0.7, 0.14, 12, 56), new T.MeshBasicMaterial({color: 0xffd54f}));
      ring.position.copy(P[i]); ring.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), tang(i));
      world.add(ring);
    }
    const ratio = an.compression != null ? (an.compression >= 1 ? `${an.compression.toFixed(1)}× the input` : `${(1/an.compression).toFixed(1)}× smaller than the input`) : "";
    addLabel(bn, "◆ bottleneck (deepest level)", new T.Vector3(bn.b.ox + bn.b.sx/2, bn.b.oy + bn.b.sy + 2.4, bn.b.oz + bn.b.sz/2), "#ffd54f",
             `${bn.tshape.join("×")} = ${bn.numel.toLocaleString()} values · ${ratio}` + (an.spatial_ratio > 1.5 ? ` · ${Math.round(an.spatial_ratio)}× smaller spatially` : "") + (an.stochastic ? " · stochastic latent z = μ + σ·ε" : "") +
             (an.bypass.count ? ` · ${an.bypass.count} skip links (${an.bypass.channels} ch) bypass it` : ""), false, bn);
  }
  const used = new Set();
  (an.stages || []).forEach(st => {
    const v = st.nodes.map(nm => nodeBy[rep_[nm]]).find(x => x);
    if (!v || used.has(v.name) || st.name === "bottleneck") return;
    used.add(v.name);
    const col = st.name === "bottleneck" ? "#ffd54f" : st.name.startsWith("E") ? "#90caf9" : st.name.startsWith("D") ? "#a5d6a7" : "#b0bec5";
    addLabel(v, st.name + (st.hw ? ` · ${st.hw.join("×")}` : ""), new T.Vector3(v.b.ox + v.b.sx/2, v.b.oy + v.b.sy + 3.2, v.b.oz + v.b.sz/2), col, "", true, v);
  });
  (an.pairs || []).forEach(([e1, d1]) => {
    const a = nodeBy[rep_[e1]], b = nodeBy[rep_[d1]];
    if (!a || !b || a === b) return;
    const geo = new T.BufferGeometry().setFromPoints([cen(a), cen(b)]);
    const l = new T.Line(geo, new T.LineDashedMaterial({color: 0x90caf9, transparent: true, opacity: 0.25, dashSize: 1.2, gapSize: 1.2}));
    l.computeLineDistances(); world.add(l);
  });
}

// a coloured floor under every layer of an expanded block, so membership stays visible when unfolded
function buildBlockFloors(){
  if (!$("showfloor").checked) return;
  const pad = (n, floorY, col) => {
    const len = (n.colExt || n.b.sx) + 4, wid = n.b.sz + 3, plane = new T.PlaneGeometry(len, wid);
    const mesh = new T.Mesh(plane, new T.MeshBasicMaterial({color: col, transparent: true, opacity: 0.16, side: T.DoubleSide, depthWrite: false}));
    mesh.rotation.x = -Math.PI/2;
    mesh.position.set(n.colCx ?? (n.b.ox + n.b.sx/2), floorY, n.b.oz + n.b.sz/2);
    n.grp.add(mesh);
    const edge = new T.LineSegments(new T.EdgesGeometry(plane), new T.LineBasicMaterial({color: col, transparent: true, opacity: 0.55}));
    edge.rotation.x = -Math.PI/2; edge.position.copy(mesh.position);
    n.grp.add(edge);
  };
  const blocks = new Map();
  G.nodes.forEach(n => { if (n.block && n.kind !== "group") (blocks.get(n.block) || blocks.set(n.block, []).get(n.block)).push(n); });
  blocks.forEach((ms, id) => {
    if (ms.length < 2) return;
    const col = new T.Color(G.blockColors[id] || FLOORCOL[0]);
    const floorY = Math.min(...ms.map(n => n.b.oy)) - 0.8;
    ms.forEach(n => pad(n, floorY, col));
    const first = ms[0];
    addLabel(first, `${id} · ${ms.length} layers`, new T.Vector3(first.colCx ?? first.b.ox, floorY + 0.4, first.b.oz + first.b.sz + 1.2),
             "#" + col.getHexString(), "", true, first);
  });
  G.nodes.forEach(n => {                       // a collapsed block keeps the colour of its expanded floor
    if (n.kind !== "group") return;
    pad(n, n.b.oy - 0.8, new T.Color(G.blockColors[n.name] || FLOORCOL[0]));
  });
}

// a vertical ruler left of the model (line layout): one tick per resolution level, faint guides along the model
function buildDepthRuler(){
  G.rulerBox = null;
  if (!G.depthOn || $("layout").value !== "line") return;
  const lv = G.levels, step = G.levelStep, c0 = G.cols[0];
  const x0 = c0.cx - c0.ext/2 - 7, zb = -Math.max(...G.cols.map(c => c.zext))/2 - 3, top = G.nodes.reduce((a, n) => Math.max(a, n.b.sy), 0)/2 + 1;
  const ybot = -(lv.length - 1)*step, bn = G.analysis && G.analysis.bottleneck && nodeBy[G.rep[G.analysis.bottleneck]];
  const bl = bn ? bn.level : null;
  const pts = [], guide = [];
  const seg = (a, p, q) => a.push(p[0], p[1], p[2], q[0], q[1], q[2]);
  seg(pts, [x0, top, 0], [x0, ybot - top, 0]);
  const add3 = (arr, mat) => { const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(arr, 3));
    const l = new T.LineSegments(g, mat); l.frustumCulled = false; world.add(l); return l; };
  const head = document.createElement("div"); head.className = "lb rl";
  head.innerHTML = `<b style="color:#b0bec5;font-size:11px;font-weight:500">Depth · resolution level</b><span>Lower = more downsampled</span>`;
  $("labels").appendChild(head); labels.push({d: head, pos: new T.Vector3(x0 - 1.2, top + 2.5, 0), node: null, always: true});
  lv.forEach(l => {
    const y = -l.level*step, hot = l.level === bl;
    seg(pts, [x0 - 0.8, y, 0], [x0 + 0.8, y, 0]);
    seg(guide, [x0, y, zb], [G.totalLen, y, zb]);
    const d = document.createElement("div"); d.className = "lb rl";
    const col = hot ? "#ffd54f" : "#b0bec5";
    d.innerHTML = `<b style="color:${col};font-size:11px;font-weight:500">${hot ? "◆ " : ""}L${l.level} · ${l.hw[0]}×${l.hw[1]}</b>` +
      `<span>${l.ch ? (l.ch[0] === l.ch[1] ? l.ch[0] : l.ch[0] + "–" + l.ch[1]) + " ch · " : ""}${l.count} layers${hot ? " · bottleneck" : ""}</span>`;
    $("labels").appendChild(d); labels.push({d, pos: new T.Vector3(x0 - 1.2, y, 0), node: null, always: true});
  });
  G.rulerBox = new T.Box3(new T.Vector3(x0 - Math.max(16, 0.12*G.totalLen), ybot - top, zb), new T.Vector3(x0, top + 3, 0));
  add3(pts, new T.LineBasicMaterial({color: 0x90a4ae}));
  add3(guide, new T.LineBasicMaterial({color: 0x90a4ae, transparent: true, opacity: 0.18}));
}

// ---------- tensor-size profile (bottom chart) ----------
let profHover = -1, profGeom = null;
const fmtCount = n => n >= 1e9 ? +(n/1e9).toPrecision(3) + "B" : n >= 1e6 ? +(n/1e6).toPrecision(3) + "M" : n >= 1e3 ? +(n/1e3).toPrecision(3) + "K" : String(Math.round(n));
function renderProfile(){
  const card = $("profcard"), cv_ = $("profile"), vs = visSpine || [];
  card.hidden = vs.length < 3; if (card.hidden){ profGeom = null; return; }
  const dpr = Math.min(devicePixelRatio || 1, 2), W_ = cv_.clientWidth, H_ = cv_.clientHeight;
  if (!W_) return;
  if (cv_.width !== Math.round(W_*dpr) || cv_.height !== Math.round(H_*dpr)){ cv_.width = Math.round(W_*dpr); cv_.height = Math.round(H_*dpr); }
  const c = cv_.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W_, H_);
  const BP = document.documentElement.dataset.theme === "blueprint";
  const P = BP ? {grid: "rgba(234,244,255,.14)", axis: "rgba(234,244,255,.5)", text: "#a9c4e2", line: "#ffffff", fill: "255,255,255"}
               : {grid: "#1e1e28", axis: "#3a3a48", text: "#8a8a96", line: "#5cdcff", fill: "92,220,255"};
  const ls = vs.map(v => Math.log10(Math.max(1, v.numel)));
  let lo = Math.floor(Math.min(...ls)), hi = Math.ceil(Math.max(...ls)); if (hi === lo) hi = lo + 1;
  const L = 40, R = 10, Tp = 8, B = 20, pw = W_ - L - R, ph = H_ - Tp - B;
  const X = i => L + pw * i/(vs.length - 1), Y = l => Tp + ph * (1 - (l - lo)/(hi - lo));
  c.font = "10px system-ui,Segoe UI,sans-serif"; c.textBaseline = "middle";
  // y axis: one gridline per decade
  const step = hi - lo > 6 ? 2 : 1;
  for (let p = lo; p <= hi; p += step){
    const y = Math.round(Y(p)) + .5;
    c.strokeStyle = p === lo ? P.axis : P.grid; c.lineWidth = 1; c.beginPath(); c.moveTo(L, y); c.lineTo(W_ - R, y); c.stroke();
    c.fillStyle = P.text; c.textAlign = "right"; c.fillText(fmtCount(10**p), L - 6, y);
  }
  // x axis: layer positions
  c.textAlign = "center"; c.textBaseline = "top";
  const nt = Math.max(2, Math.min(8, Math.floor(pw/70))), every = Math.max(1, Math.ceil((vs.length - 1)/nt));
  for (let i = 0; i < vs.length; i += every){
    const x = Math.round(X(i)) + .5; c.strokeStyle = P.axis; c.beginPath(); c.moveTo(x, Tp + ph); c.lineTo(x, Tp + ph + 4); c.stroke();
    c.fillStyle = P.text; c.fillText(String(i + 1), x, Tp + ph + 6);
  }
  c.textAlign = "right"; c.fillStyle = "#5a5a68"; c.fillText("layer →", W_ - R, Tp + ph + 6);
  // bottleneck marker
  const an = G.analysis, bn = an && an.bottleneck && G.rep[an.bottleneck], bi = vs.findIndex(v => v.name === bn);
  if (bi >= 0){ c.strokeStyle = "rgba(255,213,79,.55)"; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(X(bi), Tp); c.lineTo(X(bi), Tp + ph); c.stroke(); c.setLineDash([]); }
  // area + line
  const grad = c.createLinearGradient(0, Tp, 0, Tp + ph); grad.addColorStop(0, `rgba(${P.fill},.28)`); grad.addColorStop(1, `rgba(${P.fill},0)`);
  c.beginPath(); c.moveTo(X(0), Tp + ph); vs.forEach((v, i) => c.lineTo(X(i), Y(ls[i]))); c.lineTo(X(vs.length - 1), Tp + ph); c.closePath(); c.fillStyle = grad; c.fill();
  c.beginPath(); vs.forEach((v, i) => i ? c.lineTo(X(i), Y(ls[i])) : c.moveTo(X(i), Y(ls[i]))); c.strokeStyle = P.line; c.lineWidth = 1.6; c.lineJoin = "round"; c.stroke();
  // points, coloured by layer type (smaller when crowded)
  const r = vs.length > pw/4 ? 1.6 : vs.length > pw/9 ? 2.4 : 3.2, selI = sel ? vs.findIndex(v => v.name === sel.name) : -1;
  vs.forEach((v, i) => { c.beginPath(); c.arc(X(i), Y(ls[i]), r, 0, 7); c.fillStyle = (KIND[v.kind] || KIND.op).color; c.fill(); });
  const ring = (i, col, rr) => { c.beginPath(); c.arc(X(i), Y(ls[i]), rr, 0, 7); c.strokeStyle = col; c.lineWidth = 2; c.stroke(); };
  if (bi >= 0){ c.beginPath(); c.arc(X(bi), Y(ls[bi]), 4.5, 0, 7); c.fillStyle = "#ffd54f"; c.fill(); }
  if (profHover >= 0 && profHover < vs.length){
    const x = X(profHover); c.strokeStyle = "rgba(228,228,234,.35)"; c.lineWidth = 1; c.beginPath(); c.moveTo(x, Tp); c.lineTo(x, Tp + ph); c.stroke();
    ring(profHover, "#fff", 6);
  }
  if (selI >= 0) ring(selI, BP ? "#fff" : "#5cdcff", 7);
  profGeom = {X, Y, ls, L, pw, n: vs.length};
  // header stats
  const mn = Math.min(...vs.map(v => v.numel)), mx = Math.max(...vs.map(v => v.numel)), pk = vs.find(v => v.numel === mx);
  $("pstat").innerHTML = `<b>${fmtCount(mn)}</b> → <b>${fmtCount(mx)}</b> values · peak <b>${pk.name}</b>` +
    (bi >= 0 ? ` · <span class="bn">◆ bottleneck</span>` : "");
}
function profIndexAt(e){
  if (!profGeom) return -1;
  const r = $("profile").getBoundingClientRect(), x = e.clientX - r.left;
  return clamp(Math.round((x - profGeom.L) / profGeom.pw * (profGeom.n - 1)), 0, profGeom.n - 1);
}
function profTip(i){
  const tip = $("ptip");
  if (i < 0 || !profGeom){ tip.hidden = true; return; }
  const v = visSpine[i], k = KIND[v.kind] || KIND.op, cv_ = $("profile");
  tip.innerHTML = `<b>${v.name}</b> <span class="k">#${i + 1}</span><br><i style="background:${k.color}"></i>${k.label} · ${v.label}<br>` +
    `<span class="k">shape</span> [${(v.shape || []).join(" × ")}]<br><span class="k">size</span> ${v.numel.toLocaleString()} values`;
  tip.hidden = false;
  const x = profGeom.X(i), y = profGeom.Y(profGeom.ls[i]);
  tip.style.left = clamp(cv_.offsetLeft + x, 90, $("profcard").clientWidth - 90) + "px";
  tip.style.top = (cv_.offsetTop + y - 10) + "px";
}

function rebuild(){
  computeMetricRange();
  scene.remove(world); world = new T.Group(); scene.add(world);
  sweeps = []; pickers = [];
  labels.forEach(l => l.d.remove()); labels = [];
  const showAct = document.getElementById("showact").checked && !!A;
  G.nodes.forEach(n => { n.grp = new T.Group(); applyPose(n); world.add(n.grp); });
  world.updateMatrixWorld(true);
  G.nodes.forEach(n => buildNode(n, A && A.acts, showAct));
  if (!folding){
    buildEdges(document.getElementById("showw").checked);
    mergeStatic();
    buildBlockFloors();
    buildAnalysis();
    buildDepthRuler();
    renderProfile();
  }
  refreshSweeps();
  if (sel) labels.forEach(l => l.d.classList.toggle("sel", l.node === sel));
  hlObjs = []; hlLabels = [];                  // the old world and its labels are gone
  if (!folding) refreshHighlight();
}

function fit(apply){
  world.updateMatrixWorld(true);
  const box = new T.Box3();
  pickers.forEach(p => box.union(new T.Box3().setFromObject(p)));   // instanced cells don't report per-instance bounds
  if (G.rulerBox) box.union(G.rulerBox);
  if (document.getElementById("layout").value === "line"){    // keep the model (and the depth ruler) clear of the control panel
    const pw = $("ctl").classList.contains("closed") ? 70 : 400, f = Math.max(0.4, (innerWidth - pw)/innerWidth);
    box.min.x -= (box.max.x - box.min.x)*(1/f - 1);
  }
  const size = box.getSize(new T.Vector3()), c = box.getCenter(new T.Vector3());
  const vf = camera.fov*Math.PI/180, hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const mode = document.getElementById("layout").value;
  const dir = (mode === "line" ? new T.Vector3(0, 0.3, 1) : new T.Vector3(0.0, 0.85, 0.55)).normalize();
  const dx = (size.x/2)/Math.tan(hf/2), dz = (Math.max(size.y, mode === "line" ? 0 : size.z*0.8)/2)/Math.tan(vf/2);
  const dist = Math.max(dx, dz)*1.05 + size.z/2;
  const E = size.length();
  controls.rotateSpeed = clamp(Math.sqrt(100/E), 0.15, 1);      // big models: small mouse moves must not swing the scene
  controls.panSpeed = clamp(Math.sqrt(100/E), 0.3, 1) * 1.5;
  controls.zoomSpeed = 1.2;
  controls.minDistance = 1.5; controls.maxDistance = E*2.5;
  camera.far = Math.max(2000, E*4); camera.near = Math.max(0.1, E/4000); camera.updateProjectionMatrix();
  const res = {pos: c.clone().addScaledVector(dir, dist), target: c.clone(), dist};
  if (apply === false) return res;                 // only compute the framing (used by fold animation)
  controls.target.copy(c);
  camera.position.copy(res.pos);
  camera.lookAt(c); controls.update(); needsRender = true;
  return res;
}

// move the orbit pivot to a layer (and optionally approach it) so rotation happens around what you look at
let fly = null;
function flyTo(n, approach){
  const b = n.b, c = Wp(n, new T.Vector3(b.ox + b.sx/2, b.oy + b.sy/2, b.oz + b.sz/2));
  const off = camera.position.clone().sub(controls.target);
  if (approach) off.setLength(Math.max(b.sx, b.sy, b.sz)*1.8 + 6);
  fly = {t: c, p: c.clone().add(off)};
}

// ---------- picking ----------
const ray = new T.Raycaster(), mouse = new T.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = {x:e.clientX, y:e.clientY});
function pickAt(x, y){
  mouse.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  const h = ray.intersectObjects(pickers)[0];
  return h ? h.object.userData.node : null;
}
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.abs(e.clientX-down.x) + Math.abs(e.clientY-down.y) > 4) return;
  sel = pickAt(e.clientX, e.clientY);
  labels.forEach(l => l.d.classList.toggle("sel", l.node === sel && !!sel));
  if (sel) flyTo(sel, false);
  refreshSweeps(); showPanel();
});
renderer.domElement.addEventListener("dblclick", e => {
  const n = pickAt(e.clientX, e.clientY);
  if (!n) return;
  if (n.kind === "group") transition(() => expanded.add(n.name)); else flyTo(n, true);
});
document.getElementById("profile").addEventListener("mousemove", e => { const i = profIndexAt(e); if (i !== profHover){ profHover = i; renderProfile(); } profTip(i); });
document.getElementById("profile").addEventListener("mouseleave", () => { profHover = -1; renderProfile(); profTip(-1); });
document.getElementById("profile").addEventListener("click", e => {
  const v = visSpine[profIndexAt(e)];
  if (v){ sel = v; flyTo(v, true); refreshSweeps(); showPanel(); }
});
addEventListener("resize", () => renderProfile());
addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") fit(); });

// ---------- panel ----------
function heat(canvas, M, cell){
  const R = M.length, C = M[0].length; canvas.width = C*cell; canvas.height = R*cell;
  const c = canvas.getContext("2d"), mx = Math.max(1e-9, ...M.flat().map(Math.abs));
  for (let i = 0; i < R; i++) for (let j = 0; j < C; j++){ c.fillStyle = cssDiv(M[i][j]/mx); c.fillRect(j*cell, i*cell, cell, cell); }
}
function showPanel(){
  refreshHighlight(); renderProfile();
  const p = document.getElementById("panel");
  if (!sel){ p.style.display = "none"; return; }
  const n = sel, k = KIND[n.kind];
  const rows = [["Kind", k.label], ["Class", n.label], ["Output shape", `[${n.shape.join(", ")}]`],
                ["Neurons (units)", n.units], ["Activation size", n.numel.toLocaleString() + " values"],
                ["FLOPs (approx.)", fmtParams(n.flops).replace(" ", "") + "FLOP"],
                ...(n.sampled ? [["Shown (sampled)", "[" + n.dshape.join("×") + "]"]] : []), ["Parameters", n.params.toLocaleString()],
                ...Object.entries(n.attrs).map(([a,v]) => [a, Array.isArray(v) ? v.join("×") : v]),
                ...(() => { const sk = G.edges.filter(e => e.skip && (e.src === n.name || e.dst === n.name));
                  return sk.length ? [["Skip links", sk.map(e => `<span style="color:#76ff03">↔</span> ${e.src === n.name ? e.dst : e.src} (${e.join === "cat" ? "concat" : "add"})`).join("<br>")]] : []; })()];
  p.innerHTML = `<h2 style="color:${k.color}">${n.name}</h2><div class="k">${n.label}</div>${describeLayer(n)}

  p.style.display = "block";

  const add = (title, fn) => { const h = document.createElement("div"); h.className = "k"; h.style.margin = "10px 0 4px"; h.textContent = title; ex.appendChild(h); fn(); };
  const w = n.weights;
  if (w && w.qkv){ /* attention: projections listed below */ }
  else if (w && n.kind === "conv"){
    add(`Kernels [out=${w.shape[0]}, in=${w.shape[1]}, ${w.shape[2]}×${w.shape[3]}]` + (w.data.length < w.shape[0] || w.data[0].length < w.shape[1] ? ` — showing ${w.data.length}×${w.data[0].length}` : ""), () => {
      w.data.forEach(row => { const d = document.createElement("div");
        row.forEach(kn => { const c = document.createElement("canvas"); heat(c, kn, 8); d.appendChild(c); }); ex.appendChild(d); }); });

      heat(c, w.data, Math.max(3, Math.min(14, 280/Math.max(w.data.length, w.data[0].length)))); ex.appendChild(c); });

    [["W_q", w.qkv.slice(0, D)], ["W_k", w.qkv.slice(D, 2*D)], ["W_v", w.qkv.slice(2*D)], ["W_o", w.o]].forEach(([nm, M]) =>
      add(`${nm} [out, in]`, () => { const c = document.createElement("canvas"); heat(c, M, 14); ex.appendChild(c); }));
  }
  if (n.kind === "group"){
    const btn = document.createElement("button"); btn.className = "act"; btn.textContent = "Expand this block";
    btn.onclick = () => transition(() => expanded.add(n.name)); ex.appendChild(btn);
    add("Layers inside", () => { const d = document.createElement("div"); d.className = "k";
      d.textContent = Object.entries(n.memberKinds).map(([k2, v]) => `${v}× ${k2}`).join(" · "); ex.appendChild(d); });
  } else if (n.block){
    const btn = document.createElement("button"); btn.className = "act"; btn.textContent = `Collapse block "${n.block}"`;
    btn.onclick = () => transition(() => expanded.delete(n.block)); ex.appendChild(btn);
  }
  const a = A && A.acts[n.actKey || n.name];
  if (a && a.stats) add("Statistics for the current input", () => { const d = document.createElement("div");
    d.innerHTML = `Sparsity ${(a.stats.sparsity*100).toFixed(1)} % · Mean |a| ${a.stats.mean_abs.toPrecision(3)} · Std ${a.stats.std.toPrecision(3)}` +
      (a.delta != null ? `<br>Residual change ‖F(x)‖/‖x‖ = ${a.delta.toPrecision(3)}` : ""); ex.appendChild(d); });
  if (a && a.gates) add("Router gates (rows = tokens, cols = experts)", () => { const c = document.createElement("canvas"); heat(c, a.gates, 10); ex.appendChild(c); });
  if (a && a.attn) add("Attention maps (rows = query, cols = key)", () => a.attn.forEach(m => { const c = document.createElement("canvas"); heat(c, m, 10); ex.appendChild(c); }));
  if (a && n.kind !== "input") add("Mean activation per unit", () => { const c = document.createElement("canvas"); heat(c, [a.units], 12); ex.appendChild(c); });
}

const v3 = new T.Vector3();
function animate(t){
  requestAnimationFrame(animate);
  if (fly){
    controls.target.lerp(fly.t, 0.18); camera.position.lerp(fly.p, 0.18);
    if (controls.target.distanceTo(fly.t) < 0.05 && camera.position.distanceTo(fly.p) < 0.05) fly = null;
    needsRender = true;
  }
  controls.update();
  stepFold();
  const animating = sweeps.length > 0 && $("showk").checked;
  if (!needsRender && !animating) return;           // idle: no GPU work at all
  needsRender = false;
  updateSweeps(t/1000, $("showk").checked);
  renderer.render(scene, camera);
  // labels: project, then greedy collision culling in screen space (pinned / selected / hovered labels claim space first)
  const placed = [], prio = l => (l.always ? 0 : l.node === sel && sel ? 0 : 1);
  [...labels].sort((p, q) => prio(p) - prio(q)).forEach(l => {
    v3.copy(l.pos).project(camera);
    let vis = v3.z < 1 && Math.abs(v3.x) < 1.2 && Math.abs(v3.y) < 1.2 && (!manyNodes || l.always || camera.position.distanceTo(l.pos) < 70);
    const x = (v3.x*0.5+0.5)*innerWidth, y = (-v3.y*0.5+0.5)*innerHeight;
    if (vis && !l.always){
      if (!l.w){ l.d.style.display = "block"; l.w = l.d.offsetWidth || 60; l.h = l.d.offsetHeight || 26; }
      const r = [x - l.w/2 - 3, y - l.h, x + l.w/2 + 3, y];
      if (placed.some(o => r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1])) vis = prio(l) === 0;
      if (vis) placed.push(r);
    }
    l.d.style.display = vis ? "block" : "none";
    if (vis){ l.d.style.left = x + "px"; l.d.style.top = y + "px"; }
  });
}

// ---- loading indicator: nested calls share one chip; the outermost sets the title, inner steps update the detail line ----
let loadDepth = 0, loadTimer = null;
function loadOn(title, detail){
  if (loadDepth++ === 0){
    $("loadtitle").textContent = title; $("loadmsg").textContent = detail || "";
    clearTimeout(loadTimer);   // skip the flash for operations under 120 ms
    loadTimer = setTimeout(() => { $("loading").hidden = false; document.body.classList.add("isloading"); }, 120);
  } else if (detail) $("loadmsg").textContent = detail;
}
function loadStep(detail){ if (loadDepth) $("loadmsg").textContent = detail; }
function loadOff(){

  loadDepth = 0; clearTimeout(loadTimer); $("loading").hidden = true; document.body.classList.remove("isloading");
}
