}
document.querySelectorAll("#themeseg button").forEach(b => b.onclick = () => setTheme(b.dataset.t));
setTheme(new URLSearchParams(location.search).get("theme") || store.get("theme") || "dark");

// ---- tutorial ("?" button / ? key) ----
const HELP = [
  ["Welcome to nnviz", `nnviz traces a PyTorch model and draws it in 3D: every <b>tensor is a volume</b>, every <b>layer is the operation</b>
    acting on it (sliding conv kernels, activation gates, attention maps, MoE routers…), with <b>live activations</b> for the input you choose.
    <ul><li>The panel top-left has three tabs: <b>Model</b>, <b>View</b>, <b>Display</b>.</li>
    <li>The layer inspector opens on the right when you click a layer.</li>
    <li>The legend (bottom-left) explains the colours.</li></ul>
    Reopen this guide any time with the <kbd>?</kbd> button or key.`],
  ["Move around", `<table>
    <tr><td>Left-drag</td><td>Orbit around the model</td></tr>
    <tr><td>Right-drag</td><td>Pan</td></tr>
    <tr><td>Mouse wheel</td><td>Zoom</td></tr>
    <tr><td><kbd>F</kbd> / <b>Fit view</b></td><td>Frame the whole model</td></tr>
    <tr><td><b>Look along flow</b></td><td>Put the camera behind the input, looking down the data path</td></tr></table>`],
  ["Pick a model and an input", `In the <b>Model</b> tab:
    <ul><li><b>Model list</b>: grouped zoo (CNNs, Transformers, generative…). The number after each name is its parameter count.</li>
    <li><b>Pretrained weights</b>: download real torchvision weights on load (needs internet); otherwise weights are random.</li>
    <li><b>Info</b> (<kbd>I</kbd>): the model card: what it is known for, what it introduced, what to look for.</li>
    <li><b>Input</b>: choose a class / sample or draw <b>New noise</b>. The green pill shows the prediction. Some models add sliders here
    (DDPM timestep, GAN latent interpolation).</li></ul>`],
  ["Inspect a layer", `<b>Click any layer</b> to open the inspector on the right: plain-language description, input/output shapes,
    parameters, FLOPs, kernels or weight matrices, attention maps, router gates.
    <ul><li>Its <b>skip connections</b> light up green and the layer at the other end is outlined.</li>
    <li>The <b>Tensor size</b> chart at the bottom plots the size of every layer's output along the main path (log scale). Hover a point for details; click it to jump there.</li></ul>`],
  ["Arrange and colour", `In the <b>View</b> tab:
    <ul><li><b>Layout</b>: <i>Line</i>, <i>Folded grid</i> (compact for deep nets) or <i>Spiral</i>.</li>
    <li><b>Colour layers by</b>: type, parameters, FLOPs, activation size, sparsity, mean |activation| or residual change.
    The legend shows the scale.</li>
    <li><b>Blocks</b>: fold repeated blocks (ResNet stages, Transformer layers) into single nodes. <b>Double-click</b> a block to open it.</li></ul>`],
  ["Tune the display", `In the <b>Display</b> tab, toggle what is drawn:
    <ul><li><b>Data</b>: Activations, Weights, Kernel animation, Labels.</li>
    <li><b>Structure</b>: <i>Size envelope</i> (tube following tensor size) and <i>Show depth</i> (line view: layers drop with each
    downsampling, so a U-Net draws a U).</li>
    <li><b>Performance</b>: keep <i>Easy rendering</i> on for laptops or large models; turn it off for full quality.</li></ul>`],
  ["Bring your own model", `<b>Model › Import…</b> accepts:
    <ul><li>A <code>.py</code> file defining <code>build()</code> that returns an <code>nn.Module</code>, optionally
    <code>example_input()</code> and <code>CLASSES</code>. See <code>examples/my_model.py</code>.</li>
    <li>A whole pickled module <code>.pt</code>/<code>.pth</code>. Give its input under <b>Import options</b>, for example
    <code>1,3,224,224</code> or <code>int:1,32:50257</code> for token ids.</li></ul>
    Plain state_dicts don't work: wrap them in a <code>.py</code> with <code>build()</code>.`],
  ["Keyboard shortcuts", `<table>
    <tr><td><kbd>?</kbd></td><td>Open this guide</td></tr>
    <tr><td><kbd>L</kbd></td><td>Open <b>Explain NNs</b>, the short course on neural networks</td></tr>
    <tr><td><kbd>F</kbd></td><td>Fit view</td></tr>
    <tr><td><kbd>I</kbd></td><td>Toggle the model card</td></tr>
    <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Previous / next step here; switch tabs when a tab is focused</td></tr>
    <tr><td><kbd>Esc</kbd></td><td>Close this guide</td></tr></table>
    <p style="color:var(--mut);margin-top:10px">Tip: the panel remembers its tab and collapsed state.</p>`],
];
let hIdx = 0, hReturn = null;
HELP.forEach((_, i) => { const d = document.createElement("button"); d.setAttribute("aria-label", `step ${i + 1}`); d.onclick = () => helpGo(i); $("hdots").appendChild(d); });
function helpGo(i){
  hIdx = Math.max(0, Math.min(HELP.length - 1, i));
  $("hstep").textContent = `Step ${hIdx + 1} of ${HELP.length}`;
  $("htitle").textContent = HELP[hIdx][0]; $("hbody").innerHTML = HELP[hIdx][1]; $("hbody").scrollTop = 0;
  [...$("hdots").children].forEach((d, j) => d.classList.toggle("on", j === hIdx));
  $("hprev").disabled = hIdx === 0;
  $("hnext").textContent = hIdx === HELP.length - 1 ? "Done" : "Next";
}
function helpOpen(i = 0){ hReturn = document.activeElement; $("help").hidden = false; helpGo(i); $("hnext").focus();
  $("helpbtn").classList.remove("pulse"); store.set("seenHelp", "1"); }
function helpClose(){ $("help").hidden = true; if (hReturn && hReturn.focus) hReturn.focus(); }
$("helpbtn").onclick = () => helpOpen(0);
$("hclose").onclick = helpClose;
$("hprev").onclick = () => helpGo(hIdx - 1);
$("hnext").onclick = () => hIdx === HELP.length - 1 ? helpClose() : helpGo(hIdx + 1);
$("help").addEventListener("mousedown", e => { if (e.target === $("help")) helpClose(); });
addEventListener("keydown", e => {
  const open = !$("help").hidden;
  if (!open && !$("learn").hidden) return;   // the course dialog handles its own keys (learn.js)
  if (open){
    if (e.key === "Escape") helpClose();
    else if (e.key === "ArrowRight") helpGo(hIdx + 1);
    else if (e.key === "ArrowLeft") helpGo(hIdx - 1);
    else if (e.key === "Tab"){   // keep focus inside the dialog
      const f = [...$("help").querySelectorAll("button:not(:disabled)")], a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a){ z.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === z){ a.focus(); e.preventDefault(); }
    }
    e.stopImmediatePropagation(); return;
  }
  if (e.key === "?" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ helpOpen(0); e.preventDefault(); }
}, true);
if (!store.get("seenHelp")) $("helpbtn").classList.add("pulse");

function viewAlong(){
  const n0 = G.nodes.find(n => n.kind === "input") || G.nodes[0], p = n0.pose;
  const fwd = new T.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw)), P = new T.Vector3(p.px, p.py, p.pz);
  camera.position.copy(P).addScaledVector(fwd, -22).add(new T.Vector3(0, 7, 0));
  controls.target.copy(P).addScaledVector(fwd, 40); controls.update();
}

// ---- ?perf=1: time every stage of a model load and print a summary to the console (for profiling) ----
if (new URLSearchParams(location.search).get("perf")){
  const T0 = {}, acc = {};
  const wrap = name => { const f = window[name]; if (typeof f !== "function") return;
    window[name] = function(...a){ const t = performance.now(), r = f.apply(this, a);
      const done = () => { const d = performance.now() - t; (acc[name] = acc[name] || {n: 0, ms: 0}).n++; acc[name].ms += d; };
      if (r && typeof r.then === "function") return r.then(v => (done(), v)); done(); return r; }; };
  ["loadGraph", "loadActs", "makeView", "layout", "rebuildAll", "rebuild", "buildNode", "renderLegend", "renderProfile",
   "computeMetricRange", "refreshSweeps", "renderGallery", "showPanel"].forEach(wrap);
  const rr = renderer.render.bind(renderer); let frames = 0, fms = 0;
  renderer.render = (s_, c_) => { const t = performance.now(); rr(s_, c_); frames++; fms += performance.now() - t; };
  const rf = window.fetch.bind(window); window.fetch = async (...a) => { const t = performance.now(), r = await rf(...a);
    const u = String(a[0]).split("?")[0]; const j = r.json.bind(r);
    r.json = async () => { const t2 = performance.now(), v = await j(); (acc["parse " + u] = acc["parse " + u] || {n: 0, ms: 0}).n++; acc["parse " + u].ms += performance.now() - t2; return v; };
    (acc["fetch " + u] = acc["fetch " + u] || {n: 0, ms: 0}).n++; acc["fetch " + u].ms += performance.now() - t; return r; };
  window.perfReport = () => {
    const rows = Object.entries(acc).sort((a, b) => b[1].ms - a[1].ms).map(([k, v]) => `${k}=${v.ms.toFixed(0)}ms/${v.n}`);
    const geo = renderer.info;
    console.info(`[perf] ${G && G.model} nodes=${G0 && G0.nodes.length} drawCalls=${geo.render.calls} tris=${geo.render.triangles} ` +
      `geoms=${geo.memory.geometries} labels=${labels.length} frames=${frames} avgFrame=${(fms/Math.max(1, frames)).toFixed(1)}ms | ${rows.join(" ")}`);
    rf("/api/perf", {method: "POST", body: `${G && G.model} nodes=${G0 && G0.nodes.length} edges=${G0 && G0.edges.length} drawCalls=${geo.render.calls} ` +
      `tris=${geo.render.triangles} geoms=${geo.memory.geometries} labels=${labels.length} frames=${frames} avgFrame=${(fms/Math.max(1, frames)).toFixed(1)}ms | ${rows.join(" ")}`}).catch(() => {});
  };
  setTimeout(() => window.perfReport(), +new URLSearchParams(location.search).get("perf") > 1 ? +new URLSearchParams(location.search).get("perf") : 6000);
}

(async function init(){
  const ms = await (await fetch("/api/models")).json();
  const sel_ = $("model"), groups = {};
  ms.models.forEach(m => {
    if (!groups[m.group]){ groups[m.group] = document.createElement("optgroup"); groups[m.group].label = m.group; sel_.appendChild(groups[m.group]); }
    const o = new Option(`${m.id}  ·  ${fmtParams(m.params)}`, m.id); o.title = m.desc; groups[m.group].appendChild(o);
    MODELS[m.id] = m;
  });
  if (ms.upload === false){
    $("upbtn").disabled = true; $("upbtn").title = "Model import is disabled on this server";
    $("upbtn").dataset.locked = "1";
  }
  const qp = new URLSearchParams(location.search);
  try { if (localStorage.getItem("nnviz.card") === "0") $("cardtoggle").checked = false; } catch (e) {}
  if (qp.get("layout")) $("layout").value = qp.get("layout");
  if (qp.get("weights") === "0") $("showw").checked = false;
  if (qp.get("depth") === "0") $("showdepth").checked = false;
  if (qp.get("labels") === "0") { $("showl").checked = false; $("labels").style.display = "none"; }
  if (qp.get("model") && qp.get("model") !== ms.current && ms.models.some(m => m.id === qp.get("model")))
    await busy(`Loading ${qp.get("model")}…`, () => post(`/api/load?model=${qp.get("model")}`), LOAD_DETAIL);
  await withLoading("Loading model", "Fetching the traced graph", loadGraph);
  if (qp.get("focus") && nodeBy[qp.get("focus")]){   // look at one layer from above
    const f = nodeBy[qp.get("focus")], c = Wp(f, new T.Vector3(f.b.ox + f.b.sx/2, 0, f.b.oz + f.b.sz/2));
    controls.target.copy(c); camera.position.copy(c).add(new T.Vector3(-4, 17, 15)); controls.update();
  }
  if (qp.get("collapse") === "0"){ $("grpblocks").checked = false; expanded.clear(); rebuildAll(false); }
  if (qp.get("fold") === "collapse") setTimeout(() => $("collapseall").click(), 800);   // test hook: run the fold animation
  if (qp.get("fold") === "expand") setTimeout(() => $("expandall").click(), 800);
  if (qp.get("along")) viewAlong();
  if (qp.get("select") && nodeBy[qp.get("select")]){ sel = nodeBy[qp.get("select")]; showPanel(); refreshSweeps(); }
  if (qp.get("card") === "0") setCard(false);
  if (qp.get("learn") && window.learnOpen) window.learnOpen(Math.max(0, (parseInt(qp.get("learn")) || 1) - 1));   // ?learn=1 opens the course (?learn=4: chapter 4)
  if (qp.get("help")) helpOpen(Math.max(0, (parseInt(qp.get("help")) || 1) - 1));   // ?help=1 opens the tutorial (?help=3: step 3)
  if (qp.get("tab")) setTab(qp.get("tab"));
  if (qp.get("cam")){   // x,y,z,tx,ty,tz in world units
    const v = qp.get("cam").split(",").map(Number);
    camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); controls.update();
  }
  sel_.onchange = () => busy(`Loading ${sel_.value}…`, async () => {
    await post(`/api/load?model=${encodeURIComponent(sel_.value)}&pretrained=${$("pre").checked ? 1 : 0}`);
    await loadGraph();
  }, $("pre").checked ? "Downloading pretrained weights (first time only), then tracing the graph" : LOAD_DETAIL);
  $("pre").onchange = () => { if ($("pre").checked) setStatus("Pretrained weights are downloaded on load (torchvision CNN/ViT only); re-select the model to apply"); };
  $("upbtn").onclick = () => $("file").click();
  $("file").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    busy(`Importing ${f.name}…`, async () => {
      const j = await post(`/api/upload?name=${encodeURIComponent(f.name)}&input=${encodeURIComponent($("inshape").value.trim())}`, f);
      if (![...sel_.options].some(o => o.value === j.model)){ const o = new Option(j.model, j.model); sel_.add(o); }
      await loadGraph();
    }, "Uploading the file, building the model and tracing its graph");
    e.target.value = "";
  };
  $("layout").onchange = e => { arrange(e.target.value); rebuild(); fit(); syncSeg(); updateDepthChip(); };
  $("metric").onchange = () => { rebuild(); renderLegend(); };
  $("showenv").onchange = () => rebuild();
  $("showfloor").onchange = () => rebuild();
  $("showdepth").onchange = () => { rebuildAll(true); fit(); };
  $("grpblocks").onchange = () => transition(() => expanded.clear(), true);
  $("collapseall").onclick = () => transition(() => { $("grpblocks").checked = true; expanded.clear(); }, true);
  $("expandall").onclick = () => transition(() => { $("grpblocks").checked = false; expanded.clear(); }, true);
  document.querySelectorAll("#layoutseg button").forEach(b => b.onclick = () => {
    $("layout").value = b.dataset.v; $("layout").dispatchEvent(new Event("change")); });
  $("collapse").onclick = () => setClosed(!$("ctl").classList.contains("closed"));
  addEventListener("resize", fitLeft);
  $("showl").onchange = e => { $("labels").style.display = e.target.checked ? "" : "none"; };
  $("cls").onchange = loadActs;
  $("resample").onclick = () => { seed++; loadActs(); };
  $("showact").onchange = rebuild;
  $("easy").onchange = () => { renderer.setPixelRatio($("easy").checked ? 1 : Math.min(devicePixelRatio || 1, 2));
                               renderer.setSize(innerWidth, innerHeight); rebuild(); };
  $("showk").onchange = () => { needsRender = true; };
  $("showw").onchange = rebuild;
  $("fit").onclick = fit;
  $("cardtoggle").onchange = () => setCard($("cardtoggle").checked);
  addEventListener("keydown", e => { if ((e.key === "i" || e.key === "I") && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) setCard(!$("cardtoggle").checked); });
  $("along").onclick = viewAlong;
  requestAnimationFrame(animate);
})();
</script>
